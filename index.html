<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企業級專案整合入口平台</title>
  
  <!-- SortableJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --primary-color: #2563eb;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      --danger-color: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.05), transparent 60%);
      color: var(--text-color);
      margin: 0;
      min-height: 100vh;
    }

    #app-container {
      padding: 40px 30px;
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0;
    }

    .btn-reset {
      background: #f1f5f9;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      background: var(--text-color);
      color: #ffffff;
    }

    .search-bar {
      margin-bottom: 30px;
    }

    .search-bar input {
      width: 100%;
      max-width: 420px;
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      outline: none;
      font-size: 14px;
      box-shadow: var(--shadow-sm);
    }

    .search-bar input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: grab;
      position: relative;
      user-select: none;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary-color);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-color);
      word-break: break-word;
      margin-right: 8px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .btn-icon:hover {
      background: #f1f5f9;
      color: var(--danger-color);
    }

    .drag-handle {
      color: var(--text-muted);
      font-size: 14px;
      opacity: 0.4;
      cursor: grab;
    }

    .card-desc-container {
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .card-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .btn-edit-desc {
      background: none;
      border: none;
      color: var(--primary-color);
      font-size: 12px;
      cursor: pointer;
      padding: 0;
      margin-top: 6px;
      text-decoration: underline;
      display: inline-block;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    /* 可點擊的語言 / HTML 標籤 */
    .badge-link {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      background: #e0f2fe;
      color: #0369a1;
      text-decoration: none;
      transition: background 0.2s;
      display: inline-block;
    }

    .badge-link:hover {
      background: #bae6fd;
    }

    .links a {
      color: var(--primary-color);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      margin-left: 8px;
      padding: 6px 12px;
      border-radius: 8px;
      background: #f1f5f9;
      transition: all 0.2s;
    }

    .links a:hover {
      background: var(--primary-color);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <h1>企業專案儀表板</h1>
      <button class="btn-reset" onclick="resetHiddenRepos()">👁️ 重置隱藏專案</button>
    </header>

    <div class="search-bar">
      <input type="text" id="search" placeholder="🔍 搜尋企業專案...">
    </div>

    <div class="grid" id="repo-grid"></div>
  </div>

  <script>
    const GITHUB_USERNAME = "jacky1903002";
    
    // 讀取隱藏的專案與自訂敘述的快取
    let hiddenRepoIds = JSON.parse(localStorage.getItem('hidden_repos') || '[]');
    let customDescriptions = JSON.parse(localStorage.getItem('custom_descriptions') || '{}');

    let allRepos = [];
    let sortableInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
      fetchLiveRepos();

      document.getElementById('search').addEventListener('input', (e) => {
        const keyword = e.target.value.toLowerCase().trim();
        filterAndRender(keyword);
      });
    });

    async function fetchLiveRepos() {
      try {
        const response = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=50`);
        if (response.ok) {
          const data = await response.json();
          allRepos = data.filter(repo => !repo.fork);
          filterAndRender();
        } else {
          throw new Error("API 限制");
        }
      } catch (e) {
        // 備用靜態專案列表
        allRepos = [
          { id: '1', name: "jacky1903002.github.io", description: "", language: "HTML", html_url: `https://github.com/${GITHUB_USERNAME}/jacky1903002.github.io` },
          { id: '2', name: "equipmentexpansionganttchart", description: "", language: "HTML", html_url: `https://github.com/${GITHUB_USERNAME}/equipmentexpansionganttchart` },
          { id: '3', name: "Machinecustomerconfig", description: "", language: "HTML", html_url: `https://github.com/${GITHUB_USERNAME}/Machinecustomerconfig` },
          { id: '4', name: "01-mfgoutput", description: "", language: "HTML", html_url: `https://github.com/${GITHUB_USERNAME}/01-mfgoutput`, homepage: `https://${GITHUB_USERNAME}.github.io/01-mfgoutput` },
          { id: '5', name: "02-mfgoutput", description: "", language: "HTML", html_url: `https://github.com/${GITHUB_USERNAME}/02-mfgoutput`, homepage: `https://${GITHUB_USERNAME}.github.io/02-mfgoutput` },
          { id: '6', name: "03-mfgoutput", description: "", language: "HTML", html_url: `https://github.com/${GITHUB_USERNAME}/03-mfgoutput`, homepage: `https://${GITHUB_USERNAME}.github.io/03-mfgoutput` }
        ];
        filterAndRender();
      }
    }

    function filterAndRender(keyword = '') {
      const visibleRepos = allRepos.filter(repo => {
        const isHidden = hiddenRepoIds.includes(String(repo.id));
        const desc = customDescriptions[repo.id] || repo.description || '';
        const matchesKeyword = repo.name.toLowerCase().includes(keyword) || desc.toLowerCase().includes(keyword);
        return !isHidden && matchesKeyword;
      });

      renderRepos(visibleRepos);
    }

    function renderRepos(repos) {
      const grid = document.getElementById("repo-grid");
      if (repos.length === 0) {
        grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;'>尚無專案或專案已被隱藏。</p>";
        return;
      }

      grid.innerHTML = repos.map(repo => {
        const pageUrl = `https://${GITHUB_USERNAME}.github.io/${repo.name}/`;
        const currentDesc = customDescriptions[repo.id] || repo.description || "企業內部開發專案項目。";

        return `
          <div class="card" data-id="${repo.id}">
            <div>
              <div class="card-header">
                <span class="card-title">${repo.name}</span>
                <div class="card-actions">
                  <button class="btn-icon" onclick="hideRepo('${repo.id}')" title="隱藏專案">👁️</button>
                  <span class="drag-handle">⣿</span>
                </div>
              </div>
              <div class="card-desc-container">
                <div class="card-desc" id="desc-${repo.id}">${currentDesc}</div>
                <button class="btn-edit-desc" onclick="editDescription('${repo.id}')">✏️ 編輯敘述</button>
              </div>
            </div>
            <div class="card-footer">
              <!-- HTML 標籤直接連結至 GitHub Pages -->
              <a href="${pageUrl}" target="_blank" class="badge-link" title="點擊預估開啟網頁">${repo.language || "HTML"}</a>
              <div class="links">
                <a href="${repo.html_url}" target="_blank">Repo</a>
                ${repo.homepage ? `<a href="${repo.homepage}" target="_blank">Demo 🔗</a>` : ""}
              </div>
            </div>
          </div>
        `;
      }).join('');

      if (sortableInstance) sortableInstance.destroy();
      sortableInstance = new Sortable(grid, {
        animation: 200,
        ghostClass: 'sortable-ghost',
        dragClass: 'sortable-drag',
        easing: "cubic-bezier(0.2, 1, 0.1, 1)"
      });
    }

    // 1. 隱藏專案
    function hideRepo(id) {
      hiddenRepoIds.push(String(id));
      localStorage.setItem('hidden_repos', JSON.stringify(hiddenRepoIds));
      filterAndRender(document.getElementById('search').value.toLowerCase().trim());
    }

    // 重置隱藏專案
    function resetHiddenRepos() {
      hiddenRepoIds = [];
      localStorage.removeItem('hidden_repos');
      filterAndRender(document.getElementById('search').value.toLowerCase().trim());
    }

    // 2. 編輯專案敘述
    function editDescription(id) {
      const currentDesc = customDescriptions[id] || "企業內部開發專案項目。";
      const newDesc = prompt("請輸入專案敘述：", currentDesc);
      if (newDesc !== null) {
        customDescriptions[id] = newDesc.trim();
        localStorage.setItem('custom_descriptions', JSON.stringify(customDescriptions));
        document.getElementById(`desc-${id}`).innerText = customDescriptions[id] || "企業內部開發專案項目。";
      }
    }
  </script>
</body>
</html>
