<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企業級專案整合入口平台</title>
  
  <!-- SortableJS (實現活潑拖曳與自動對齊網格) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    :root {
      /* 淺色簡報專用主題色系 */
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --primary-color: #2563eb;
      --accent-color: #0284c7;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.05), transparent 60%);
      color: var(--text-color);
      margin: 0;
      min-height: 100vh;
    }

    /* --- 主頁面區塊 --- */
    #app-container {
      padding: 40px 30px;
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0;
      color: var(--text-color);
    }

    .search-bar {
      margin-bottom: 30px;
    }

    .search-bar input {
      width: 100%;
      max-width: 420px;
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      outline: none;
      font-size: 14px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .search-bar input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* --- 卡牌與 Grid 佈局 --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: grab;
      position: relative;
      user-select: none;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .card:active { cursor: grabbing; }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary-color);
    }

    .sortable-ghost {
      opacity: 0.4;
      background: #eff6ff;
      border: 2px dashed var(--primary-color);
    }

    .sortable-drag {
      transform: rotate(2deg) scale(1.03) !important;
      box-shadow: var(--shadow-md);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-color);
      margin: 0 0 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drag-handle {
      color: var(--text-muted);
      font-size: 14px;
      opacity: 0.4;
    }

    .card-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      flex-grow: 1;
      margin-bottom: 20px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      background: #e0f2fe;
      color: #0369a1;
    }

    .links a {
      color: var(--primary-color);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      margin-left: 8px;
      padding: 6px 12px;
      border-radius: 8px;
      background: #f1f5f9;
      transition: all 0.2s;
    }

    .links a:hover {
      background: var(--primary-color);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <h1>企業專案儀表板</h1>
    </header>

    <div class="search-bar">
      <input type="text" id="search" placeholder="🔍 搜尋企業專案...">
    </div>

    <!-- 可拖曳與自動對齊的卡牌網格區域 -->
    <div class="grid" id="repo-grid"></div>
  </div>

  <script>
    const GITHUB_USERNAME = "jacky1903002";

    // 預設核心專案清單 (內建資料：保證 0 秒呈現)
    const initialRepos = [
      {
        id: 1,
        name: "Enterprise-Portal",
        description: "企業內部入口整合平台，提供單一簽入與專案整合檢視。",
        language: "JavaScript",
        html_url: `https://github.com/${GITHUB_USERNAME}`,
        homepage: ""
      },
      {
        id: 2,
        name: "AI-Customer-Service",
        description: "基於 LLM 大語言模型的智慧客服機器人與自動回覆系統。",
        language: "Python",
        html_url: `https://github.com/${GITHUB_USERNAME}`,
        homepage: ""
      },
      {
        id: 3,
        name: "Cloud-Resource-Dashboard",
        description: "多雲架構資源監控與費用分析儀表板專案。",
        language: "TypeScript",
        html_url: `https://github.com/${GITHUB_USERNAME}`,
        homepage: ""
      },
      {
        id: 4,
        name: "Data-Pipeline-Service",
        description: "自動化資料抽取、轉換與載入 (ETL) 的高效能處理工具。",
        language: "Go",
        html_url: `https://github.com/${GITHUB_USERNAME}`,
        homepage: ""
      },
      {
        id: 5,
        name: "Smart-Manufacturing-IoT",
        description: "智慧製造物聯網設備狀態監測與異常即時通報系統。",
        language: "Vue",
        html_url: `https://github.com/${GITHUB_USERNAME}`,
        homepage: ""
      },
      {
        id: 6,
        name: "Mobile-HR-App",
        description: "行動端企業人資打卡、請假與薪資單查詢系統。",
        language: "Flutter",
        html_url: `https://github.com/${GITHUB_USERNAME}`,
        homepage: ""
      }
    ];

    let allRepos = [...initialRepos];
    let sortableInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
      // 1. 立即渲染預設專案資料
      renderRepos(allRepos);

      // 2. 嘗試背景更新真實 GitHub API 資料
      fetchLiveRepos();

      // 3. 搜尋過濾功能
      document.getElementById('search').addEventListener('input', (e) => {
        const keyword = e.target.value.toLowerCase().trim();
        const filtered = allRepos.filter(repo => 
          repo.name.toLowerCase().includes(keyword) || 
          (repo.description && repo.description.toLowerCase().includes(keyword))
        );
        renderRepos(filtered);
      });
    });

    // 非同步抓取 GitHub 實時專案
    async function fetchLiveRepos() {
      try {
        const response = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=30`);
        if (response.ok) {
          const data = await response.json();
          const fetched = data.filter(repo => !repo.fork);
          if (fetched.length > 0) {
            allRepos = fetched;
            renderRepos(allRepos);
          }
        }
      } catch (e) {
        console.log("連線失敗，維持內建展示資料。");
      }
    }

    // 渲染卡牌並啟動 SortableJS 拖曳
    function renderRepos(repos) {
      const grid = document.getElementById("repo-grid");
      if (repos.length === 0) {
        grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: var(--text-muted);'>尚無符合條件的專案。</p>";
        return;
      }

      grid.innerHTML = repos.map(repo => `
        <div class="card" data-id="${repo.id}">
          <div>
            <div class="card-title">
              <span>${repo.name}</span>
              <span class="drag-handle">⣿</span>
            </div>
            <div class="card-desc">${repo.description || "企業內部開發專案項目。"}</div>
          </div>
          <div class="card-footer">
            <span class="badge">${repo.language || "Project"}</span>
            <div class="links">
              <a href="${repo.html_url}" target="_blank">Repo</a>
              ${repo.homepage ? `<a href="${repo.homepage}" target="_blank">Demo 🔗</a>` : ""}
            </div>
          </div>
        </div>
      `).join('');

      if (sortableInstance) sortableInstance.destroy();
      sortableInstance = new Sortable(grid, {
        animation: 200,
        ghostClass: 'sortable-ghost',
        dragClass: 'sortable-drag',
        easing: "cubic-bezier(0.2, 1, 0.1, 1)",
      });
    }
  </script>
</body>
</html>
