<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企業級專案整合入口平台</title>
  
  <!-- SortableJS (實現活潑拖曳與自動對齊網格) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: rgba(22, 27, 34, 0.75);
      --card-hover-bg: #1f242d;
      --border-color: rgba(255, 255, 255, 0.1);
      --primary-color: #2563eb;
      --accent-color: #38bdf8;
      --text-color: #f3f4f6;
      --text-muted: #9ca3af;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.15), transparent 70%);
      color: var(--text-color);
      margin: 0;
      min-height: 100vh;
    }

    /* --- 主頁面區塊 --- */
    #app-container {
      padding: 30px;
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 1.5rem;
      margin: 0;
      background: linear-gradient(90deg, #fff, var(--accent-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-bar {
      margin-bottom: 30px;
    }

    .search-bar input {
      width: 100%;
      max-width: 400px;
      padding: 12px 18px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: white;
      outline: none;
      font-size: 14px;
    }

    /* --- 活潑卡牌與 Grid 佈局 --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: grab;
      position: relative;
      user-select: none;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .card:active { cursor: grabbing; }

    .card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      border-color: var(--accent-color);
      background: var(--card-hover-bg);
    }

    .sortable-ghost {
      opacity: 0.3;
      border: 2px dashed var(--accent-color);
    }

    .sortable-drag {
      transform: rotate(3deg) scale(1.05) !important;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drag-handle {
      color: var(--text-muted);
      font-size: 12px;
      opacity: 0.5;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      flex-grow: 1;
      margin-bottom: 20px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-color);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      margin-left: 10px;
      padding: 5px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      transition: background 0.2s;
    }

    .links a:hover {
      background: var(--primary-color);
    }
  </style>
</head>
<body>

  <!-- 主頁面區塊 -->
  <div id="app-container">
    <header>
      <h1>企業專案儀表板</h1>
    </header>

    <div class="search-bar">
      <input type="text" id="search" placeholder="🔍 搜尋企業專案...">
    </div>

    <!-- 可拖曳與自動對齊的卡牌網格區域 -->
    <div class="grid" id="repo-grid">
      <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">載入專案資料中...</p>
    </div>
  </div>

  <script>
    const GITHUB_USERNAME = "jacky1903002";[cite: 1]
    let allRepos = [];
    let sortableInstance = null;

    // 網頁載入完成後直接抓取 GitHub 專案
    document.addEventListener('DOMContentLoaded', () => {
      fetchRepos();

      // 綁定搜尋輸入框事件
      document.getElementById('search').addEventListener('keyup', (e) => {
        const keyword = e.target.value.toLowerCase();[cite: 1]
        const filtered = allRepos.filter(repo => 
          repo.name.toLowerCase().includes(keyword) || 
          (repo.description && repo.description.toLowerCase().includes(keyword))[cite: 1]
        );
        renderRepos(filtered);
      });
    });

    // 抓取 GitHub 專案資料
    async function fetchRepos() {
      try {
        const response = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=100`);[cite: 1]
        const data = await response.json();[cite: 1]
        allRepos = data.filter(repo => !repo.fork);[cite: 1]
        renderRepos(allRepos);
      } catch (error) {
        document.getElementById("repo-grid").innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>載入專案資料失敗。</p>";
      }
    }

    // 渲染卡牌並開啟 SortableJS 拖曳對齊
    function renderRepos(repos) {
      const grid = document.getElementById("repo-grid");
      if (repos.length === 0) {
        grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: var(--text-muted);'>尚無符合條件的專案。</p>";
        return;
      }

      grid.innerHTML = repos.map(repo => `
        <div class="card" data-id="${repo.id}">
          <div>
            <div class="card-title">
              <span>${repo.name}</span>
              <span class="drag-handle">:::</span>
            </div>
            <div class="card-desc">${repo.description || "企業內部開發專案項目。"}</div>
          </div>
          <div class="card-footer">
            <span class="badge">${repo.language || "Project"}</span>
            <div class="links">
              <a href="${repo.html_url}" target="_blank">Repo</a>
              ${repo.homepage ? `<a href="${repo.homepage}" target="_blank">Demo 🔗</a>` : ""}
            </div>
          </div>
        </div>
      `).join('');

      if (sortableInstance) sortableInstance.destroy();
      sortableInstance = new Sortable(grid, {
        animation: 250,
        ghostClass: 'sortable-ghost',
        dragClass: 'sortable-drag',
        easing: "cubic-bezier(1, 0, 0, 1)",
      });
    }
  </script>
</body>
</html>
