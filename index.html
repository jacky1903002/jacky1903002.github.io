<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企業級專案整合入口平台</title>
  
  <!-- SortableJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: rgba(22, 27, 34, 0.75);
      --card-hover-bg: #1f242d;
      --border-color: rgba(255, 255, 255, 0.1);
      --primary-color: #2563eb;
      --accent-color: #38bdf8;
      --text-color: #f3f4f6;
      --text-muted: #9ca3af;
      --danger-color: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.15), transparent 70%);
      color: var(--text-color);
      margin: 0;
      min-height: 100vh;
    }

    #auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .auth-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .auth-card h2 {
      margin-top: 0;
      color: #ffffff;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .password-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      padding-right: 45px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.6);
      color: #fff;
      box-sizing: border-box;
      outline: none;
      font-size: 14px;
    }

    .toggle-password-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 5px;
      user-select: none;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    #app-container {
      display: none;
      padding: 30px;
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 1.5rem;
      margin: 0;
      background: linear-gradient(90deg, #fff, var(--accent-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger-color);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .search-bar {
      margin-bottom: 30px;
    }

    .search-bar input {
      width: 100%;
      max-width: 400px;
      padding: 12px 18px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: white;
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: grab;
      user-select: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--accent-color);
      background: var(--card-hover-bg);
    }

    .sortable-ghost { opacity: 0.3; border: 2px dashed var(--accent-color); }
    .sortable-drag { transform: rotate(3deg) scale(1.05) !important; }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 8px 0;
      display: flex;
      justify-content: space-between;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      flex-grow: 1;
      margin-bottom: 20px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-color);
    }

    .links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      margin-left: 10px;
      padding: 5px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
    }

    #error-msg {
      color: var(--danger-color);
      font-size: 13px;
      margin-top: 12px;
      display: none;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div id="auth-container">
    <div class="auth-card">
      <h2>企業入口網站登入</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 24px;">請輸入電子郵件與密碼存取專案列表</p>
      
      <form id="login-form">
        <div class="form-group">
          <label for="email">電子郵件</label>
          <input type="email" id="email" placeholder="name@company.com" required>
        </div>
        
        <div class="form-group">
          <label for="password">密碼</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" placeholder="••••••••" required>
            <button type="button" class="toggle-password-btn" id="togglePasswordBtn" title="顯示/隱藏密碼">👁️</button>
          </div>
        </div>
        
        <button type="submit" class="btn-primary" id="loginBtn">登入 / 註冊</button>
      </form>
      
      <div id="error-msg"></div>
    </div>
  </div>

  <div id="app-container">
    <header>
      <h1>企業專案儀表板</h1>
      <div class="header-actions">
        <span style="font-size: 13px; color: var(--text-muted);" id="user-display"></span>
        <button class="btn-logout" id="logoutBtn">登出</button>
      </div>
    </header>

    <div class="search-bar">
      <input type="text" id="search" placeholder="🔍 搜尋企業專案...">
    </div>

    <div class="grid" id="repo-grid">
      <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">驗證權限中...</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBIdwm3yULBLJi3O0oHvmngxkIBgF7Q7j4",
      authDomain: "jacky1903002.firebaseapp.com",
      projectId: "jacky1903002",
      storageBucket: "jacky1903002.firebasestorage.app",
      messagingSenderId: "1018532314889",
      appId: "1:1018532314889:web:ec04aec0fc9224e76d5dd8",
      measurementId: "G-FLMTC0QJ38"
    };

    console.log("正在初始化 Firebase...");
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const GITHUB_USERNAME = "jacky1903002";[cite: 1]
    let allRepos = [];
    let sortableInstance = null;

    // 1. 眼睛切換密碼事件
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    togglePasswordBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const passwordInput = document.getElementById('password');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        togglePasswordBtn.innerText = '🙈';
      } else {
        passwordInput.type = 'password';
        togglePasswordBtn.innerText = '👁️';
      }
    });

    // 2. 登入事件
    const loginForm = document.getElementById('login-form');
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      console.log("觸發登入/註冊流程...");

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('error-msg');
      const loginBtn = document.getElementById('loginBtn');

      errorMsg.style.display = 'none';
      loginBtn.innerText = "驗證中...";
      loginBtn.disabled = true;

      try {
        console.log("嘗試登入:", email);
        await signInWithEmailAndPassword(auth, email, password);
        console.log("登入成功！");
      } catch (error) {
        console.warn("登入失敗，代碼:", error.code, "訊息:", error.message);
        
        // 嘗試自動註冊
        if (
          error.code === 'auth/user-not-found' || 
          error.code === 'auth/invalid-credential' ||
          error.code === 'auth/wrong-password'
        ) {
          try {
            console.log("帳號不存在或密碼不符，嘗試建立新帳號...");
            await createUserWithEmailAndPassword(auth, email, password);
            console.log("註冊成功！");
          } catch (createError) {
            console.error("註冊失敗:", createError);
            showError(getCustomErrorMessage(createError.code));
          }
        } else {
          showError(getCustomErrorMessage(error.code));
        }
      } finally {
        loginBtn.innerText = "登入 / 註冊";
        loginBtn.disabled = false;
      }
    });

    // 3. 登出事件
    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

    // 4. 搜尋事件
    document.getElementById('search').addEventListener('keyup', (e) => {
      const keyword = e.target.value.toLowerCase();[cite: 1]
      const filtered = allRepos.filter(repo => 
        repo.name.toLowerCase().includes(keyword) || 
        (repo.description && repo.description.toLowerCase().includes(keyword))[cite: 1]
      );
      renderRepos(filtered);
    });

    function getCustomErrorMessage(code) {
      switch(code) {
        case 'auth/weak-password': return "密碼長度太短（請至少輸入 6 位數）";
        case 'auth/invalid-email': return "電子郵件格式不正確";
        case 'auth/operation-not-allowed': return "錯誤：請至 Firebase Console 啟用 Email/Password 登入功能！";
        case 'auth/network-request-failed': return "網路連線失敗，請檢查網路連線。";
        default: return `驗證失敗 (${code})`;
      }
    }

    function showError(msg) {
      const errorMsg = document.getElementById('error-msg');
      errorMsg.innerText = msg;
      errorMsg.style.display = 'block';
    }

    // 監聽登入狀態
    onAuthStateChanged(auth, (user) => {
      if (user) {
        console.log("當前已登入使用者:", user.email);
        document.getElementById('auth-container').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';
        document.getElementById('user-display').innerText = user.email;
        fetchRepos();
      } else {
        console.log("當前未登入");
        document.getElementById('auth-container').style.display = 'flex';
        document.getElementById('app-container').style.display = 'none';
      }
    });

    // 抓取 GitHub 專案
    async function fetchRepos() {
      try {
        const response = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=100`);[cite: 1]
        const data = await response.json();[cite: 1]
        allRepos = data.filter(repo => !repo.fork);[cite: 1]
        renderRepos(allRepos);
      } catch (error) {
        document.getElementById("repo-grid").innerHTML = "<p>載入專案資料失敗。</p>";
      }
    }

    // 渲染卡牌與 Sortable
    function renderRepos(repos) {
      const grid = document.getElementById("repo-grid");
      if (repos.length === 0) {
        grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>尚無符合條件的專案。</p>";
        return;
      }

      grid.innerHTML = repos.map(repo => `
        <div class="card" data-id="${repo.id}">
          <div>
            <div class="card-title">
              <span>${repo.name}</span>
              <span style="opacity:0.5; font-size:12px;">:::</span>
            </div>
            <div class="card-desc">${repo.description || "企業內部開發專案項目。"}</div>
          </div>
          <div class="card-footer">
            <span class="badge">${repo.language || "Project"}</span>
            <div class="links">
              <a href="${repo.html_url}" target="_blank">Repo</a>
              ${repo.homepage ? `<a href="${repo.homepage}" target="_blank">Demo 🔗</a>` : ""}
            </div>
          </div>
        </div>
      `).join('');

      if (sortableInstance) sortableInstance.destroy();
      sortableInstance = new Sortable(grid, {
        animation: 250,
        ghostClass: 'sortable-ghost',
        dragClass: 'sortable-drag',
        easing: "cubic-bezier(1, 0, 0, 1)",
      });
    }
  </script>
</body>
</html>
